      std: [3.0104901790618896, 2.595674991607666, 2.679351568222046, 2.618288993835449, 3.2503621578216553, 2.522343635559082, 3.006690263748169, 3.1320528984069824, 2.624333620071411, 3.0638256072998047, 2.517951250076294, 2.8298025131225586, 2.1840291023254395, 2.596125364303589, 3.1539266109466553, 2.4548797607421875, 2.335315465927124, 3.064091444015503, 2.367276430130005, 2.362698554992676, 2.468536853790283, 2.535972833633423, 2.6541008949279785, 2.8236730098724365, 3.072847843170166, 3.7248048782348633, 3.2415668964385986, 2.367354393005371, 2.739168167114258, 3.6655173301696777, 1.9162994623184204, 2.929597854614258]
    pbr_normalization:

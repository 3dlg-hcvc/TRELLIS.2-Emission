# Emission VAE (pbr->emission) on LightgenBench.
#
# The encoder takes the 3-channel emission and gives the 32-channel emission latent; the decoder takes
# cat(z_emission 32, z_pbr 32), where z_pbr comes from TRELLIS.2's frozen PBR encoder
# (pretrained_pbr_encoder). The architecture is TRELLIS.2's PBR VAE apart from its input and output
# channels.
#
# The dataset paths are placeholders: script/lightgenbench/run_chain.sh overrides data_root,
# parquet_file and split_json with the data root it is given.
#
# The four tensors whose shapes differ from the pretrained PBR VAE:
#   encoder.input_layer.weight    (64,6)    -> (64,3)     emission RGB in
#   decoder.from_latent.weight    (1024,32) -> (1024,64)  cat(z_emission, z_pbr)
#   decoder.output_layer.weight   (6,64)    -> (3,64)     emission RGB out
#   decoder.output_layer.bias     (6,)      -> (3,)       emission RGB out
# data_toolkit/init_emission_vae_from_pbr_vae.py derives all four from the pretrained weights (see
# finetune_ckpt below), so no tensor starts random.
models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3          # emission RGB
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32     # keeps the DiT at in=96 / out=32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3         # emission RGB
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 64     # cat(z_emission 32, z_pbr 32)
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false
dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgenbench
    parquet_file: data/lightgenbench/df_lightgenbench.parquet
    resolution: 256
    split: train
    split_json: data/lightgenbench/data_splits_lightgenbench.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha
trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 35800
    # run_chain.sh overrides this to hold a global batch of 64 (4 GPUs x 16 by default) and stops
    # if the product differs, unless ANY_BATCH=1. This value applies when train.py runs directly.
    batch_size_per_gpu: 32
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    # T_max must equal max_steps. CosineAnnealingLR is periodic with period 2*T_max, so a smaller
    # T_max does not anneal: the lr climbs back up after T_max steps.
    lr_scheduler:
      name: CosineAnnealingLR
      args:
        T_max: 35800
        eta_min: 1.0e-06
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    # Initial weights derived from TRELLIS.2's pretrained PBR VAE, not the raw hub files: with those,
    # the trainer skips the four shape-mismatched tensors (trellis2/trainers/basic.py drops them, it does
    # not adapt them) and encoder.input_layer and decoder.from_latent start random. The derived files
    # load all 284 tensors of each side. Build them (gitignored, about 1.6 GB, deterministic; the vae
    # stage of run_chain.sh does this):
    #   python data_toolkit/init_emission_vae_from_pbr_vae.py \
    #       --out data/ckpt_init/pbr2emission_v3 \
    #       --verify-config configs/scvae/emission_vae_pbr2emission_lightgenbench_v1.yaml
    finetune_ckpt:
      encoder: data/ckpt_init/pbr2emission_v3/encoder.safetensors
      decoder: data/ckpt_init/pbr2emission_v3/decoder.safetensors
    # The frozen PBR encoder that gives z_pbr.
    pretrained_pbr_encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
    i_log: 10
    i_sample: 2000
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 32
    val_every_epochs: 1
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: LightGen
    wandb_name: vae_pbr->emission_lightgenbench_v1
